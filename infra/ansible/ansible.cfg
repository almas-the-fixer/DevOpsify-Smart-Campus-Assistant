[defaults]

# C'mon It's Ansible still these are the VMs Ansible will Configure
inventory = ./inventory/hosts.ini

# Refer to infra/terraform/main.tf and look at our vm resource
remote_user = scadmin

# Path to the Private key which we will use to login to VM
private_key_file = ~/.ssh/id_rsa

# Duh.. Do I need to Explain this?
# Actually You've to Manually SSH in to the created vm or at lease add that VMs  Key to 'Known Hosts' then you can ping it with ansible else it will throw an error like: [ERROR]: Task failed: Failed to connect to the host via ssh: ssh_askpass: exec(/usr/lib/ssh/ssh-askpass): No such file or directory, Host key verification failed.
# Alternatively Just do "host_key_checking = False" below to Stop that error However its not recommended in Prod! for this Demo its Cool... : )
host_key_checking = True