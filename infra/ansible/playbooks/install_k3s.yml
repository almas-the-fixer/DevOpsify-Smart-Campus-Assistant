---
- name: Install and Configure K3s on the smart_campus_app_vm
  hosts: smart_campus_app_vm
  become: true
  tasks:

    - name: Update Package Cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Stop and disable UFW service
      ansible.builtin.service:
        name: ufw
        state: stopped
        enabled: false

    - name: Install K3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_KUBECONFIG_MODE="644" sh -
      args:
        creates: /usr/local/bin/k3s   # Idempotency Guard : )

    - name: Ensure K3s service is running
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Create .kube directory
      ansible.builtin.file:
        path: /home/scadmin/.kube
        state: directory
        owner: scadmin
        group: scadmin
        mode: '0700'

    - name: Copy K3s kubeconfig
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/scadmin/.kube/config
        remote_src: true
        owner: scadmin
        group: scadmin
        mode: '0600'

    - name: Verify kubectl exists
      become: false
      ansible.builtin.command:
        cmd: /usr/local/bin/kubectl version --client
    
    - name: Verify K3s cluster
      become: false
      ansible.builtin.command:
        cmd: kubectl get nodes